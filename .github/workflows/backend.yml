name: Backend (API)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_PATH: backend/SubTracker.Api/SubTracker.Api.csproj
  TEST_PROJECT_PATH: backend/SubTracker.Api.Tests/SubTracker.Api.Tests.csproj

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:

      #---------------
      #-----Build
      #---------------

      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore


      #---------------
      #-----Test
      #---------------

      # Ett rött test stoppar jobbet, så publicering och deploy nedan körs aldrig med trasig kod.
      - name: Test
        run: dotnet test ${{ env.TEST_PROJECT_PATH }} --configuration Release

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ./publish


      #---------------
      #-----Deploy
      #---------------

      - name: Deploy till Azure App Service
        if: github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
