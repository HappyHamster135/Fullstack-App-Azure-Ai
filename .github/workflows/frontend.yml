name: Frontend (React)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:

      #---------------
      #-----Build
      #---------------

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installera paket
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testa
        run: npm test

      - name: Bygg
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}


      #---------------
      #-----Deploy
      #---------------

      - name: Deploy till Azure Static Web Apps
        if: github.ref == 'refs/heads/main' && vars.VITE_API_URL != '' && vars.AZURE_FRONTEND_WEBAPP_NAME == ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist
          output_location: ''
          skip_app_build: true

      - name: Deploy till Azure App Service
        if: github.ref == 'refs/heads/main' && vars.VITE_API_URL != '' && vars.AZURE_FRONTEND_WEBAPP_NAME != ''
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_FRONTEND_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_FRONTEND_PUBLISH_PROFILE }}
          package: frontend/dist
